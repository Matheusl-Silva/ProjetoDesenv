services:
  db:
    build: ./database
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lab-net

  backend:
    build: ./backend
    restart: always
    env_file: .env
    # Sem 'ports' -> não publica no host. Acessível apenas pelos outros
    # containers via http://backend:3000 (rede interna lab-net).
    expose:
      - "3000"
    depends_on:
      - db
    networks:
      - lab-net

  frontend:
    build: ./frontend
    restart: always
    env_file: .env
    # Só escuta em 127.0.0.1 do host -> o Apache do host faz o proxy via
    # http://127.0.0.1:8081. De fora da máquina não dá pra acessar direto.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    networks:
      - lab-net

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    # Só localhost do servidor -> acessar via SSH tunnel:
    # ssh -L 8080:127.0.0.1:8080 root@2.25.161.81
    # Depois abrir http://localhost:8080 no navegador.
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: K9mXq2vL7nRp4Wz8
    networks:
      - lab-net

volumes:
  db_data:

networks:
  lab-net:
